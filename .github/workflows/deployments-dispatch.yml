# Reusable workflow: notifies the address-book aggregator repo when a project's
# committed deployments/ registry changes on the default branch.
#
# Usage in a consuming project (.github/workflows/deployments.yml):
#
#   name: Deployments
#   on:
#     push:
#       branches: [main]
#       paths: ["deployments/**"]
#   jobs:
#     dispatch:
#       uses: credit-cooperative/devkit/.github/workflows/deployments-dispatch.yml@v1
#       secrets:
#         app-id: ${{ secrets.CC_CI_APP_ID }}
#         app-private-key: ${{ secrets.CC_CI_APP_PRIVATE_KEY }}
#
# Authenticates as the org-owned "Credit Coop CI" GitHub App and mints a short-lived
# installation token (scoped to the target repo) to send the repository_dispatch event.
# The App must be installed on the target repo with Contents: write.
name: Deployments Dispatch

on:
  workflow_call:
    inputs:
      target-repo:
        default: credit-cooperative/address-book
        description: Aggregator repository that receives the repository_dispatch event
        required: false
        type: string
    secrets:
      app-id:
        description: GitHub App ID used to mint the dispatch token
        required: true
      app-private-key:
        description: GitHub App private key (PEM) used to mint the dispatch token
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve target repo name
        id: target
        env:
          TARGET_REPO: ${{ inputs.target-repo }}
        run: echo "name=${TARGET_REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Mint a GitHub App token scoped to the aggregator
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.target.outputs.name }}

      - name: Collect changed registry files
        id: changes
        run: | #shell
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            before="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          files="$(git diff --name-only "$before" "${{ github.sha }}" -- 'deployments/*.json' 'deployments/abis/*.json' \
            | jq --raw-input . | jq --slurp --compact-output .)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed registry files: $files"

      - name: Send repository_dispatch to the aggregator
        if: steps.changes.outputs.files != '[]'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: | #shell
          jq --null-input \
            --arg repo "${{ github.repository }}" \
            --arg ref "${{ github.sha }}" \
            --argjson files '${{ steps.changes.outputs.files }}' \
            '{event_type: "deployments-updated", client_payload: {repo: $repo, ref: $ref, files: $files}}' \
            | gh api "repos/${{ inputs.target-repo }}/dispatches" --input -
          echo "Dispatched deployments-updated to ${{ inputs.target-repo }}"
